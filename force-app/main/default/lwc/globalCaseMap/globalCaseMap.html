<template>
  <div class="shell">

    <!-- ── Header ──────────────────────────────────────────────────────────── -->
    <div class="header">
      <div class="header-brand">
        <div class="brand-logo"><span class="brand-ring"></span></div>
        <div>
          <div class="header-title">Consumer Care Intelligence</div>
          <div class="header-sub">Coca‑Cola Company &nbsp;·&nbsp; Global Quality &amp; Supply Chain Monitor</div>
        </div>
      </div>

      <div class="header-filters">
        <lightning-combobox placeholder="All Products"       value={filterProduct}   options={productOptions}   onchange={handleFilterProduct}></lightning-combobox>
        <lightning-combobox placeholder="All Complaint Types" value={filterComplaint} options={complaintOptions} onchange={handleFilterComplaint}></lightning-combobox>
        <lightning-combobox placeholder="All Severity Levels" value={filterSeverity}  options={severityOptions}  onchange={handleFilterSeverity}></lightning-combobox>
      </div>

      <div class="header-kpis">
        <div class="kpi"><span class="kpi-val">{statTotal}</span><span class="kpi-lbl">Open Cases</span></div>
        <div class="kpi-sep"></div>
        <div class="kpi kpi--red"><span class="kpi-val">{statCritical}</span><span class="kpi-lbl">Critical</span></div>
        <div class="kpi-sep"></div>
        <div class="kpi"><span class="kpi-val">{statScope}</span><span class="kpi-lbl">Scope</span></div>
        <div class="live-badge"><span class="live-dot"></span>Live</div>
      </div>
    </div>

    <!-- ── Sub-nav ──────────────────────────────────────────────────────────── -->
    <div class="subnav">
      <div class="subnav-left">
        <template if:true={canDrillBack}>
          <button class="back-btn" onclick={handleBack}>‹ Back</button>
          <span class="bc-divider"></span>
        </template>
        <span class="bc-text">{breadcrumb}</span>
      </div>
      <div class="subnav-hint">
        <template if:true={isWorld}>Click any shaded country · Click United States to drill to state level</template>
        <template if:true={isUsa}>Click any state · Georgia has an active critical alert</template>
        <template if:true={isGeorgia}>Click any county · Red pins mark active complaint clusters traced to bottler ATL-03</template>
      </div>
      <div class="zoom-group">
        <button class="zoom-btn" onclick={handleZoomIn}>+</button>
        <button class="zoom-btn" onclick={handleZoomOut}>−</button>
        <button class="zoom-btn" onclick={handleResetZoom} title="Reset">⟲</button>
      </div>
    </div>

    <!-- ── Body ─────────────────────────────────────────────────────────────── -->
    <div class="body">

      <!-- Map -->
      <div class="map-area" lwc:ref="mapContainer"></div>

      <!-- Insight Panel -->
      <div class="panel">

        <!-- Empty / landing state -->
        <template if:false={showPanel}>
          <div class="panel-landing">
            <template if:true={isWorld}>
              <p class="landing-eyebrow">Global View</p>
              <h3 class="landing-headline">Complaint heat map by severity</h3>
              <p class="landing-body">Countries are shaded by severity of open consumer complaints. Click any shaded country for supply chain insights, or drill into the United States for state-level detail.</p>
              <button class="cta-btn" onclick={handleDrillUsa}>Explore United States ›</button>
            </template>
            <template if:true={isUsa}>
              <p class="landing-eyebrow">United States</p>
              <h3 class="landing-headline">State-level complaint density</h3>
              <p class="landing-body"><strong>Georgia</strong> has a critical active alert — off-taste complaints traced to a specific bottler batch in metro Atlanta. Click any state to see supply chain detail.</p>
              <button class="cta-btn cta-btn--red" onclick={handleDrillGeorgia}>View Georgia Critical Alert ›</button>
            </template>
            <template if:true={isGeorgia}>
              <p class="landing-eyebrow">Georgia — Critical Alert</p>
              <h3 class="landing-headline">Retailer complaints traced to Bottler ATL-03</h3>
              <p class="landing-body">Off-taste complaints at Kroger and Publix locations across metro Atlanta have been traced to batch <strong>ATL-C4-2024</strong> produced at CCBCC Atlanta Plant 3. Click any county for full supply chain trace and recommended actions.</p>
            </template>
          </div>
        </template>

        <!-- Detail panel -->
        <template if:true={showPanel}>
          <div class="panel-detail">

            <!-- Panel header -->
            <div class="pd-header">
              <div class="pd-header-left">
                <div class="severity-dot severity-dot--{selected.severity}"></div>
                <div>
                  <div class="pd-title">{selected.name}</div>
                  <div class="pd-meta">{selected.cases} cases &nbsp;·&nbsp; <span class="delta-text">{selected.delta} this week</span></div>
                </div>
              </div>
              <button class="pd-close" onclick={clearSelection}>✕</button>
            </div>

            <!-- Alert banner -->
            <template if:true={selected.alert}>
              <div class="alert-banner">
                <div class="alert-banner-label">Critical Alert</div>
                <div class="alert-banner-text">{selected.alertSummary}</div>
              </div>
            </template>

            <!-- Agentforce result (shown above tabs once complete) -->
            <template if:true={showAgentResult}>
              <div class="agent-result">
                <div class="agent-result-header">
                  <div class="agent-result-logo"><span class="agent-logo-dot"></span></div>
                  <div class="agent-result-title-wrap">
                    <div class="agent-result-title">Agentforce completed</div>
                    <div class="agent-result-sub">3 actions executed · case escalated</div>
                  </div>
                  <button class="agent-result-dismiss" onclick={handleAgentReset}>Reset</button>
                </div>
                <div class="agent-result-items">
                  <div class="agent-result-item">
                    <span class="agent-result-check">✓</span>
                    <span>Email drafted to <strong>{agentDistributor}</strong> — batch ATL-C4-2024 hold</span>
                  </div>
                  <div class="agent-result-item">
                    <span class="agent-result-check">✓</span>
                    <span>3 follow-up tasks created &amp; assigned in Salesforce</span>
                  </div>
                  <div class="agent-result-item">
                    <span class="agent-result-check">✓</span>
                    <span>Consumer advisory queued — lot codes 24045–24048</span>
                  </div>
                </div>
              </div>
            </template>

            <!-- Tabs -->
            <div class="tabs">
              <button class={tabChainClass}   onclick={handleTabChain}>Supply Chain</button>
              <button class={tabActionsClass} onclick={handleTabActions}>Actions</button>
              <button class={tabTrendClass}   onclick={handleTabTrend}>Trend</button>
            </div>

            <!-- ── Tab: Supply Chain ── -->
            <template if:true={showChain}>
              <div class="tab-body">

                <!-- Complaint source -->
                <div class="chain-section">
                  <div class="chain-section-label">Complaint Source</div>
                  <div class="chain-card chain-card--complaint">
                    <div class="chain-row">
                      <span class="chain-key">Type</span>
                      <span class="chain-val">{selected.complaint}</span>
                    </div>
                    <div class="chain-row">
                      <span class="chain-key">Product</span>
                      <span class="chain-val">{selected.product}</span>
                    </div>
                    <div class="chain-row chain-row--last">
                      <span class="chain-key">Retailer</span>
                      <span class="chain-val">{selected.retailer}</span>
                    </div>
                  </div>
                </div>

                <!-- Distributor -->
                <template if:true={hasDistributor}>
                  <div class="chain-section">
                    <div class="chain-section-label">Distributor</div>
                    <div class="chain-card">
                      <div class="chain-row">
                        <span class="chain-key">Company</span>
                        <span class="chain-val chain-val--strong">{selected.distributor.name}</span>
                      </div>
                      <div class="chain-row">
                        <span class="chain-key">Contact</span>
                        <span class="chain-val">{selected.distributor.contact}</span>
                      </div>
                      <div class="chain-row">
                        <span class="chain-key">Email</span>
                        <span class="chain-val chain-val--link">{selected.distributor.email}</span>
                      </div>
                      <div class="chain-row chain-row--last">
                        <span class="chain-key">Phone</span>
                        <span class="chain-val">{selected.distributor.phone}</span>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- Bottler -->
                <template if:true={hasBottler}>
                  <div class="chain-section">
                    <div class="chain-section-label">Bottler &amp; Root Cause</div>
                    <div class="chain-card chain-card--bottler">
                      <div class="chain-row">
                        <span class="chain-key">Bottler</span>
                        <span class="chain-val chain-val--strong">{selected.bottler.name}</span>
                      </div>
                      <div class="chain-row">
                        <span class="chain-key">Batch</span>
                        <span class="chain-val chain-val--mono">{selected.bottler.batch}</span>
                      </div>
                      <div class="chain-row">
                        <span class="chain-key">Root Cause</span>
                        <span class="chain-val">{selected.bottler.rootCause}</span>
                      </div>
                      <div class="chain-row chain-row--last">
                        <span class="chain-key">Hold Qty</span>
                        <span class="chain-val chain-val--alert">{selected.bottler.holdQty}</span>
                      </div>
                    </div>
                  </div>
                </template>

              </div>
            </template>

            <!-- ── Tab: Actions ── -->
            <template if:true={showActions}>
              <div class="tab-body">
                <template if:true={hasActions}>
                  <div class="actions-list">
                    <template for:each={selected.actions} for:item="action">
                      <div class="action-item" key={action.label}>
                        <div class="action-priority action-priority--{action.priority}">{action.priority}</div>
                        <div class="action-body">
                          <div class="action-label">{action.label}</div>
                          <div class="action-owner">Owner: {action.owner}</div>
                        </div>
                        <div class="action-status">Open</div>
                      </div>
                    </template>
                  </div>
                </template>
                <template if:false={hasActions}>
                  <div class="tab-empty">No immediate actions flagged for this region.</div>
                </template>

                <!-- Agentforce launch button -->
                <template if:true={showAgentButton}>
                  <div class="agent-launch-wrap">
                    <template if:false={agentRunning}>
                      <button class="agent-launch-btn" onclick={handleLaunchAgent}>
                        <span class="agent-btn-logo"><span class="agent-btn-dot"></span></span>
                        Take Action with Agentforce
                        <span class="agent-btn-arrow">→</span>
                      </button>
                    </template>
                    <template if:true={agentRunning}>
                      <div class="agent-progress-panel">
                        <div class="agent-progress-header">
                          <span class="agent-spinner"></span>
                          <span class="agent-progress-label">Agentforce is working…</span>
                        </div>
                        <div class="agent-steps">
                          <div class={agentStep1Class}>
                            <span class="agent-step-icon"></span>
                            <span class="agent-step-text">Drafting distributor notification email</span>
                          </div>
                          <div class={agentStep2Class}>
                            <span class="agent-step-icon"></span>
                            <span class="agent-step-text">Creating follow-up tasks in Salesforce</span>
                          </div>
                          <div class={agentStep3Class}>
                            <span class="agent-step-icon"></span>
                            <span class="agent-step-text">Queuing consumer advisory notification</span>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>

              </div>
            </template>

            <!-- ── Tab: Trend ── -->
            <template if:true={showTrend}>
              <div class="tab-body">
                <div class="trend-section">
                  <div class="trend-label">Weekly case volume — last 8 weeks</div>
                  <svg class="sparkline" lwc:ref="sparkline" viewBox="0 0 240 76" preserveAspectRatio="none"></svg>
                </div>
                <div class="trend-stats">
                  <div class="trend-stat">
                    <div class="trend-stat-val">{selected.cases}</div>
                    <div class="trend-stat-lbl">Current period</div>
                  </div>
                  <div class="trend-stat trend-stat--red">
                    <div class="trend-stat-val">{selected.delta}</div>
                    <div class="trend-stat-lbl">Week-over-week</div>
                  </div>
                </div>
                <div class="trend-context">
                  <div class="trend-context-label">Signal</div>
                  <p class="trend-context-text">Volume is accelerating. The 8-week trajectory indicates a supply-chain event rather than seasonal noise. Batch traceability data and the retailer distribution pattern confirm a point-source issue requiring immediate escalation.</p>
                </div>
              </div>
            </template>

          </div>
        </template>

      </div>
    </div>

  </div>
</template>
