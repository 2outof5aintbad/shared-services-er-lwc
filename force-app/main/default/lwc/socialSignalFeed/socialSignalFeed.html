<template>
  <div class="shell">

    <!-- ── Header ──────────────────────────────────────────────────────────── -->
    <div class="header">
      <div class="header-row">
        <div class="header-brand">
          <div class="brand-logo"><span class="brand-ring"></span></div>
          <div>
            <div class="header-title">Social Signal Intelligence</div>
            <div class="header-sub">Coca‑Cola Company &nbsp;·&nbsp; Data Cloud Signal Resolution &amp; First-Party Capture</div>
          </div>
        </div>
        <div class="header-actions">
          <div class="live-badge"><span class="live-dot"></span>Live</div>
          <template if:true={canSimulate}>
            <button class="simulate-btn" onclick={handleSimulate}>Simulate signal</button>
          </template>
          <template if:true={simDone}>
            <button class="simulate-btn simulate-btn--reset" onclick={handleSimulateReset}>Reset</button>
          </template>
        </div>
      </div>
      <div class="kpi-strip">
        <div class="kpi">
          <span class="kpi-val">{statTotal}</span>
          <span class="kpi-lbl">Signals Detected</span>
        </div>
        <div class="kpi-sep"></div>
        <div class="kpi">
          <span class="kpi-val kpi-val--green">{statMatched}</span>
          <span class="kpi-lbl">Profiles Matched</span>
        </div>
        <div class="kpi-sep"></div>
        <div class="kpi">
          <span class="kpi-val kpi-val--blue">{statNew}</span>
          <span class="kpi-lbl">New Profiles Created</span>
        </div>
        <div class="kpi-sep"></div>
        <div class="kpi">
          <span class="kpi-val kpi-val--purple">{statDeflected}</span>
          <span class="kpi-lbl">Calls Deflected</span>
        </div>
      </div>
    </div>

    <!-- ── Context bar ─────────────────────────────────────────────────────── -->
    <div class="context-bar">
      <span class="context-tag context-tag--alert">Batch ATL-C4-2024</span>
      <span class="context-tag">Coca-Cola Spiced 20oz</span>
      <span class="context-tag">Metro Atlanta</span>
      <span class="context-tag">Past 16 days</span>
      <span class="context-sep">·</span>
      <span class="context-note">Matched against Salesforce Data Cloud unified profiles and purchase history</span>
    </div>

    <!-- ── Body ─────────────────────────────────────────────────────────────── -->
    <div class="body">

      <!-- ── Signal Feed ─────────────────────────────────────────────────── -->
      <div class="feed">

        <template if:true={simRunning}>
          <div class="sim-panel">
            <div class="sim-header">
              <span class="sim-spinner"></span>
              <span class="sim-title">Agentforce processing signal</span>
            </div>
            <div class="sim-steps">
              <div class={simStep1Class}>
                <span class="sim-step-dot"></span>
                <span class="sim-step-text">Ingesting signal — extracting product, retailer, lot code</span>
              </div>
              <div class={simStep2Class}>
                <span class="sim-step-dot"></span>
                <span class="sim-step-text">Querying Data Cloud — identity resolution against loyalty and purchase history</span>
              </div>
              <div class={simStep3Class}>
                <span class="sim-step-dot"></span>
                <span class="sim-step-text">Match confirmed — drafting proactive outreach</span>
              </div>
            </div>
          </div>
        </template>

        <template for:each={enrichedSignals} for:item="signal">
          <div class={signal.itemClass} key={signal.id} data-id={signal.id} onclick={handleSelectSignal}>
            <div class="signal-row">
              <span class="platform-tag platform-tag--{signal.platform}">{signal.platformLabel}</span>
              <span class="signal-handle">{signal.handle}</span>
              <span class="signal-time">{signal.timestamp}</span>
              <span class="status-pill status-pill--{signal.resolution}">{signal.resolutionLabel}</span>
            </div>
            <p class="signal-text">{signal.text}</p>
            <div class="signal-footer">
              <span>{signal.product}</span>
              <span class="footer-sep">·</span>
              <span>{signal.retailer}</span>
            </div>
          </div>
        </template>

      </div>

      <!-- ── Resolution Panel ─────────────────────────────────────────────── -->
      <div class="panel">

        <template if:false={selected}>
          <div class="panel-empty">
            <p>Select a signal to view resolution detail</p>
          </div>
        </template>

        <template if:true={selected}>

          <!-- Signal origin -->
          <div class="section section--flush">
            <div class="origin-header">
              <span class="platform-tag platform-tag--{selected.platform}">{selected.platformLabel}</span>
              <div class="origin-meta">
                <span class="origin-handle">{selected.handle}</span>
                <span class="origin-time">{selected.timestamp}</span>
              </div>
              <span class="status-pill status-pill--{selected.resolution}">{selected.resolutionLabel}</span>
            </div>
            <blockquote class="signal-quote">{selected.text}</blockquote>
          </div>

          <!-- Signal detail -->
          <div class="section">
            <div class="section-label">Signal Detail</div>
            <div class="detail-grid">
              <div class="detail-row">
                <span class="detail-key">Product</span>
                <span class="detail-val">{selected.product}</span>
              </div>
              <div class="detail-row">
                <span class="detail-key">Retailer</span>
                <span class="detail-val">{selected.retailer}</span>
              </div>
              <div class="detail-row detail-row--last">
                <span class="detail-key">Batch</span>
                <span class="detail-val detail-val--mono">{selected.batch}</span>
              </div>
            </div>
          </div>

          <!-- Matched profile -->
          <template if:true={showMatchedPanel}>
            <div class="section">
              <div class="section-label section-label--green">Matched to Data Cloud Profile</div>
              <div class="detail-grid">
                <div class="detail-row">
                  <span class="detail-key">Profile ID</span>
                  <span class="detail-val detail-val--mono">{selected.profile.id}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-key">Name</span>
                  <span class="detail-val detail-val--strong">{selected.profile.name}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-key">Loyalty Tier</span>
                  <span class="detail-val">{selected.profile.loyaltyTier}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-key">Lifetime Purchases</span>
                  <span class="detail-val">{selected.profile.purchases}</span>
                </div>
                <div class="detail-row detail-row--last">
                  <span class="detail-key">Batch Overlap</span>
                  <span class="detail-val detail-val--alert">Confirmed — ATL-C4-2024</span>
                </div>
              </div>
            </div>

            <div class="section">
              <div class="section-label">Agentforce Action</div>
              <p class="action-text">{selected.profile.outreach}</p>
            </div>

            <template if:true={showProfileLinked}>
              <div class="section section--linked">
                <div class="section-label">Contact Center Link</div>
                <p class="linked-case-id">{selected.profile.callRecord}</p>
                <p class="linked-case-note">Social signal detected 4 days before inbound call. First-party data capture completed via agent-guided call flow.</p>
              </div>
            </template>
          </template>

          <!-- New profile created -->
          <template if:true={showNewProfilePanel}>
            <div class="section">
              <div class="section-label section-label--blue">New First-Party Profile Created</div>
              <div class="detail-grid">
                <div class="detail-row">
                  <span class="detail-key">Profile ID</span>
                  <span class="detail-val detail-val--mono">{selected.profile.id}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-key">Identity</span>
                  <span class="detail-val detail-val--strong">{selected.profile.name}</span>
                </div>
                <div class="detail-row detail-row--last">
                  <span class="detail-key">Batch Overlap</span>
                  <span class="detail-val detail-val--alert">Confirmed — ATL-C4-2024</span>
                </div>
              </div>
            </div>
            <div class="section">
              <div class="section-label">Agentforce Action</div>
              <p class="action-text">{selected.profile.outreach}</p>
            </div>
            <div class="section section--note">
              <div class="section-label">First-Party Data Value</div>
              <p class="note-text">Anonymous signal converted to a consented first-party record. Profile is now available for loyalty enrollment, win-back targeting, product quality research, and future quality event outreach — without requiring an inbound call.</p>
            </div>
          </template>

          <!-- Pending -->
          <template if:true={showPendingPanel}>
            <div class="section">
              <div class="section-label section-label--amber">Awaiting Resolution</div>
              <p class="action-text">No loyalty or purchase record matched for this handle. Agentforce has queued an outreach response with a consent capture link. Profile stub created — anonymous pending engagement.</p>
              <div class="pending-checklist">
                <div class="checklist-item checklist-item--active">
                  <span class="checklist-dot checklist-dot--active"></span>
                  Response drafted — pending posting approval
                </div>
                <div class="checklist-item">
                  <span class="checklist-dot"></span>
                  Consent form link queued in response
                </div>
                <div class="checklist-item">
                  <span class="checklist-dot"></span>
                  Profile stub created — anonymous, awaiting consent
                </div>
              </div>
            </div>
          </template>

        </template>
      </div>
    </div>

  </div>
</template>
